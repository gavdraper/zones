name: Release

# Manual, intentional releases. A push trigger is deliberately avoided: this job
# commits the bumped VERSION + regenerated appcast back to main, which a
# push-on-main trigger would treat as a new release and loop on forever.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | explicit version (e.g. 0.3.0)"
        required: true
        default: "patch"

permissions:
  contents: write          # upload release assets + push the VERSION/appcast commit

jobs:
  release:
    # macos-15's default Xcode ships Swift 6; macos-14 defaults to Swift 5.10,
    # which can't build a swift-tools-version 6.0 package (Package.swift).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so the commit-back pushes cleanly

      - name: Install create-dmg
        run: brew install create-dmg

      # Resolves SwiftPM deps, which fetches Sparkle's generate_appcast binary
      # artifact that Scripts/appcast.sh looks for under .build/artifacts.
      - name: Resolve dependencies
        run: swift build

      # Sign every CI build with the SAME self-signed 'Zones Dev' cert used
      # locally so the app's code-signing identity is stable. macOS keys the
      # Accessibility (TCC) grant on that identity, so users grant it ONCE and it
      # survives every auto-update. Ad-hoc signing (bundle.sh's fallback when no
      # cert is present) changes the cdhash each build and forces a re-grant.
      - name: Import the Zones Dev signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/zones-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          P12="$RUNNER_TEMP/zones-cert.p12"
          PEM="$RUNNER_TEMP/zones-cert.pem"
          echo "$MACOS_CERT_P12" | base64 --decode > "$P12"

          # A dedicated, unlocked keychain just for this build.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import the identity and let codesign use it non-interactively.
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Put our keychain first so `security find-identity` (which bundle.sh
          # gates on) resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Self-signed cert: trust it for code signing so it counts as a *valid*
          # codesigning identity. Runner sudo is passwordless -> non-interactive.
          security find-certificate -c "Zones Dev" -p "$KEYCHAIN" > "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$PEM"

          rm -f "$P12" "$PEM"
          echo "Signing identities available:"
          security find-identity -v -p codesigning

      # release.sh auto-selects the imported 'Zones Dev' identity (no Developer ID
      # present -> its built-in fallback) and signs with the hardened runtime.
      # ZONES_SKIP_NOTARIZE skips notarisation; the DMG is unnotarised, so users
      # right-click -> Open on first install only. Sparkle trusts updates via the
      # EdDSA appcast signature, and the stable identity keeps the TCC grant.
      # --- To switch on notarisation once enrolled in the Apple Developer Program:
      #   swap MACOS_CERT_* for a Developer ID cert, add notarytool credentials,
      #   and drop ZONES_SKIP_NOTARIZE. release.sh handles the rest.
      - name: Build + sign DMG (unnotarised)
        env:
          ZONES_SKIP_NOTARIZE: "1"
        run: ./Scripts/release.sh "${{ github.event.inputs.bump }}"

      - name: Stage DMG + generate EdDSA-signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist && cp build/Zones-*.dmg dist/
          ./Scripts/appcast.sh

      # The appcast's enclosure URLs point at the rolling 'downloads' release, so
      # the DMG must live there. --clobber replaces a same-named asset on re-runs.
      - name: Upload DMG to the 'downloads' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload downloads dist/Zones-*.dmg --clobber

      # Persist the version bump (release.sh rewrote ./VERSION) and the new feed
      # so GitHub Pages serves the update. [skip ci] is defensive in case a push
      # trigger is ever added later.
      - name: Commit bumped VERSION + appcast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION docs/appcast.xml
          git commit -m "release: ${{ github.event.inputs.bump }} [skip ci]"
          git push
